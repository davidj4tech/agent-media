[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-org-paragtd"
version = "0.1.0"
description = "The paragtd layout for agent-media's Notes: GTD views, refile targets, the fresh tree."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# paragtd itself (GPL-3.0) is never imported: this package reads the files it
# writes and runs its commands as their own processes. Keep it that way.
dependencies = ["agent-media-server"]

[project.entry-points."agent_media.org_profiles"]
paragtd = "agent_media_org_paragtd:profile"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_org_paragtd"]
