[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-intake-owui"
version = "0.1.0"
description = "Open WebUI intake adapter for agent-media (OWUI mic/chat -> agent session via the canvas /input path)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]
# The bridge is an OWUI Pipe function (owui/agent_media_pipe.py) that OWUI
# loads; it talks to the canvas /input endpoint over stdlib urllib — no deps.
# This package ships only the pairing/health helper (media-intake-owui).

[project.scripts]
media-intake-owui = "agent_media_intake_owui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_intake_owui"]
