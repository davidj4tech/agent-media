[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-intake-ha"
version = "0.1.0"
description = "Home Assistant SSE intake adapter for agent-media."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]

[project.scripts]
media-intake-ha-sse = "agent_media_intake_ha:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_intake_ha"]
