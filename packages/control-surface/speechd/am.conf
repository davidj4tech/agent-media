# agent-media output module for speech-dispatcher.
#
# The module itself is a plain executable speaking speechd's module protocol
# on stdin/stdout; nothing here needs configuring for it to work. These are the
# two knobs that matter, both read from the environment because a systemd user
# service is where this runs and that is the only channel it has.
#
#   AM_SPEECHD_TARGET     default target: local | rooms | phone (default: default)
#   AM_SPEECHD_MAX_CHARS  truncate an utterance past this many characters
#   AM_SPEECHD_MIN_GAP_S  minimum gap between utterances
#   AM_SPEECHD_LOG        path to a debug log
#
# A client can also pick the target per-connection, because the module offers
# the targets as synthesis voices: `spd-say -y rooms`, or SET SYNTHESIS_VOICE.
Debug 0
