# Extra Python apps that termux-python-heal.sh keeps alive alongside
# agent-media itself.
#
# These were `pip install --user` installs, so they lived in
# ~/.local/lib/python3.13/site-packages and died the moment Termux moved to
# python 3.14 — same fate as agent-media, same silence. Each one gets its own
# venv here instead, so a python upgrade is repaired by rebuilding rather than
# by remembering which pip incantation produced the current mess.
#
# Format:  name | uv venv flags | entrypoints | requirements
#
# - entrypoints are linked into ~/.local/bin (where the runit services already
#   expect them by absolute path). ONLY these names are linked: an app's venv
#   also contains scripts like `flask`, `pygmentize` and `normalizer`, and
#   linking those wholesale would hijack unrelated commands.
# - mopidy needs --system-site-packages to see gi/gstreamer, which come from
#   Termux's apt packages rather than PyPI (no wheels exist for them here).
#   Those apt packages are themselves stranded by a python upgrade — see
#   `termux-python-heal.sh --apt-repair`, which reinstalls them.

mopidy | --system-site-packages | mopidy | Mopidy Mopidy-MPD Mopidy-Beets Mopidy-Listenbrainz mopidy-iris mopidy-youtube
beets | | beet | beets Unidecode confuse filetype flask flask-cors jellyfish mediafile munkres musicbrainzngs mutagen platformdirs pyyaml rich ytmusicapi
