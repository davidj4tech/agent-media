name: Server binary

# Sasonica's server as one file per architecture (deploy/binary/build.sh),
# published to the rolling `server-latest` release that sasonica.com/install
# downloads from. Rebuilt when anything the binary carries changes on main.
# docs/proposals/2026-09-29-single-binary.md.

on:
  push:
    branches: [main]
    paths:
      - packages/core/**
      - packages/server/**
      - packages/visual/**
      - packages/sasonica/**
      - deploy/binary/**
      - deploy/install.ps1
      - .github/workflows/binary.yml
  workflow_dispatch:

concurrency:
  # Per branch: a trial run elsewhere must not cancel main's.
  group: binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Bullseye's glibc (2.31) is the oldest the launcher will need.
    container: docker.io/library/rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          deploy/binary/build.sh

      - name: Smoke test
        run: |
          b=build/binary/sasonica-linux-${{ matrix.arch }}
          HOME=$(mktemp -d) "$b" version
          HOME=$(mktemp -d) "$b" commands | grep -qx media

      - uses: actions/upload-artifact@v4
        with:
          name: sasonica-linux-${{ matrix.arch }}
          path: build/binary/sasonica-linux-${{ matrix.arch }}
          retention-days: 14

  build-macos:
    # Apple silicon. No container: the launcher is compiled with the runner's
    # cargo, against the macOS it runs on (and later).
    name: build (macos aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: deploy/binary/build.sh

      - name: Smoke test
        run: |
          b=$PWD/build/binary/sasonica-macos-aarch64
          export HOME=$(mktemp -d)
          "$b" version
          "$b" commands | grep -qx media
          # The server and the session holder start and answer.
          "$b" serve --bind 127.0.0.1 --port 18781 >serve.log 2>&1 &
          "$b" sessiond >sessiond.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18781/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:18781/healthz
          # sessiond says where its socket is; it must be there.
          for i in $(seq 1 30); do grep -q "listening on" sessiond.log && break; sleep 1; done
          cat sessiond.log
          sock=$(sed -n 's/.*listening on \([^ ]*\).*/\1/p' sessiond.log | head -1)
          test -S "$sock"
          # install writes launchd agents; lint them, bootstrap nothing.
          "$b" install --dry-run --no-services
          python3 - "$b" <<'PY'
          import plistlib, sys
          sys.path.insert(0, "packages/sasonica/src")
          from sasonica import install
          p = install.plist_text("com.sasonica.canvas", sys.argv[1], "serve", "0.0.0.0", 8781)
          d = plistlib.loads(p.encode())
          assert d["ProgramArguments"][1] == "serve" and d["KeepAlive"], d
          open("canvas.plist", "w").write(p)
          PY
          plutil -lint canvas.plist
          kill %1 %2 || true
          cat serve.log sessiond.log | tail -20

      - uses: actions/upload-artifact@v4
        with:
          name: sasonica-macos-aarch64
          path: build/binary/sasonica-macos-aarch64
          retention-days: 14

  build-windows:
    name: build (windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: deploy/binary/build.sh

      - name: Smoke test
        run: deploy/binary/smoke-windows.sh "$PWD/build/binary/sasonica-windows-x86_64.exe"

      - name: Quick tunnel through Cloudflare (NEEDS NETWORK; allowed to fail)
        # The real thing: the pinned cloudflared fetched and checked by
        # install, a quick tunnel to the public listener, and /healthz
        # answered through it from trycloudflare.com. Quick tunnels are
        # best-effort (no SLA) and need Cloudflare and GitHub reachable, so a
        # failure here is a warning, not a red build. Nothing is published:
        # MEDIA_LOOKUP_URL=-.
        continue-on-error: true
        timeout-minutes: 6
        run: |
          b=$PWD/build/binary/sasonica-windows-x86_64.exe
          export MEDIA_LOOKUP_URL=-
          "$b" install --no-services | tee install-real.txt
          tr -d '\r' <install-real.txt | grep -q 'sha256 checked\|already there\|on PATH'
          MEDIA_VISUAL_PUBLIC=127.0.0.1:18789 "$b" serve --bind 127.0.0.1 --port 18781 >serve-t.log 2>&1 &
          MEDIA_VISUAL_PUBLIC=127.0.0.1:18789 "$b" media-tunnel run >tunnel-real.log 2>&1 &
          url=$("$b" media-tunnel url --wait 90 | tr -d '\r') || { cat tunnel-real.log; exit 1; }
          echo "tunnel: $url"
          for i in $(seq 1 30); do curl -fsS -m 10 "$url/healthz" && break; sleep 3; done
          curl -fsS -m 10 "$url/healthz"
          "$b" pair --device CI | tr -d '\r' | grep -q "server=$(printf %s "$url" | sed 's|:|%3A|; s|/|%2F|g')&code="
          kill %1 %2 || true

      - uses: actions/upload-artifact@v4
        with:
          name: sasonica-windows-x86_64
          path: build/binary/sasonica-windows-x86_64.exe
          retention-days: 14

  windows-arm64:
    # Windows 11 on ARM64 runs the x64 build under its x64 emulation (Prism),
    # with the x64 cloudflared: no ARM64 build (David, 16 Oct 2026). The .exe
    # the job above built, the same smoke test, install.ps1's architecture
    # check on a real ARM64 machine. Publishes nothing (and gates nothing:
    # the release does not wait for it).
    name: smoke (windows arm64, x64 emulated)
    needs: build-windows
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      MEDIA_LOOKUP_URL: "-"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: sasonica-windows-x86_64
          path: build/binary

      - name: Where we are
        run: |
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE PROCESSOR_ARCHITEW6432=${PROCESSOR_ARCHITEW6432:-}"
          # Git Bash here is x64, emulated: it reads AMD64, and a PowerShell
          # it starts says X64 for OS and process alike. The registry's
          # system value is the machine's own.
          powershell -NoProfile -Command '"OS " + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture + ", Windows PowerShell " + [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture' || true
          pwsh -NoProfile -Command '"pwsh: OS " + [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture + ", process " + [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture' || true
          reg query 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' //v PROCESSOR_ARCHITECTURE | tee reg.txt
          grep -q 'ARM64' reg.txt

      - name: Smoke test (x64 under emulation)
        run: deploy/binary/smoke-windows.sh "$PWD/build/binary/sasonica-windows-x86_64.exe"

      - name: The x64 cloudflared is the one install fetches
        run: |
          b=$PWD/build/binary/sasonica-windows-x86_64.exe
          # What the binary's own (x64, emulated) Python calls this machine.
          py=$(find "$(cygpath -u "$LOCALAPPDATA")/pyapp" -name python.exe 2>/dev/null | head -1)
          [ -n "$py" ] && "$py" -I -c "import platform, sys; print('binary python:', platform.machine(), sys.version)" || true
          "$b" install --dry-run --no-services | tr -d '\r' | tee install.txt
          if command -v cloudflared >/dev/null || [ -e "$USERPROFILE/.local/bin/cloudflared.exe" ]; then
            echo "::warning::cloudflared already on this runner; the asset choice is checked by the unit tests only"
            grep -Eq 'cloudflared: .*(already there|on PATH)' install.txt
          else
            grep -Eq 'cloudflared: would fetch .*/2026\.[0-9.]+/cloudflared-windows-amd64\.exe' install.txt
          fi

      - name: install.ps1's architecture check (Windows PowerShell and pwsh)
        env:
          SASONICA_EXPECT_ARCH: ARM64
        run: |
          repo=$(cygpath -w "$PWD")
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packages/sasonica/tests/check-install-ps1.ps1 "$repo" | tee ps51.txt
          pwsh -NoProfile -NonInteractive -File packages/sasonica/tests/check-install-ps1.ps1 "$repo" | tee ps7.txt
          ! grep -h '^FAIL' ps51.txt ps7.txt
          grep -q 'ok    arch: this machine is ARM64' ps51.txt
          grep -q 'ok    arch: this machine is ARM64' ps7.txt

      - name: Quick tunnel through Cloudflare (NEEDS NETWORK; allowed to fail)
        # The x64 cloudflared, fetched and sha256-checked by install, emulated:
        # a real quick tunnel and /healthz through it. Best-effort, like the
        # x64 job's. Nothing published: MEDIA_LOOKUP_URL=-.
        continue-on-error: true
        timeout-minutes: 6
        run: |
          b=$PWD/build/binary/sasonica-windows-x86_64.exe
          "$b" install --no-services | tee install-real.txt
          tr -d '\r' <install-real.txt | grep -q 'sha256 checked\|already there\|on PATH'
          MEDIA_VISUAL_PUBLIC=127.0.0.1:18789 "$b" serve --bind 127.0.0.1 --port 18781 >serve-t.log 2>&1 &
          MEDIA_VISUAL_PUBLIC=127.0.0.1:18789 "$b" media-tunnel run >tunnel-real.log 2>&1 &
          url=$("$b" media-tunnel url --wait 90 | tr -d '\r') || { cat tunnel-real.log; exit 1; }
          echo "tunnel: $url"
          for i in $(seq 1 30); do curl -fsS -m 10 "$url/healthz" && break; sleep 3; done
          curl -fsS -m 10 "$url/healthz"
          kill %1 %2 || true

  publish:
    needs: [build, build-macos, build-windows]
    # Only main's builds are the release; a trial run on a branch is not.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to server-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum sasonica-* >SHA256SUMS
          gh release view server-latest >/dev/null 2>&1 ||
            gh release create server-latest --prerelease --target "$GITHUB_SHA" \
              --title "Sasonica server (latest)" \
              --notes "Built from main on every change to the server. Install: curl -fsSL https://sasonica.com/install | bash"
          gh release upload server-latest sasonica-linux-* sasonica-macos-* sasonica-windows-* SHA256SUMS --clobber
          gh release edit server-latest --notes "Built from main at $GITHUB_SHA. Install: curl -fsSL https://sasonica.com/install | bash"
