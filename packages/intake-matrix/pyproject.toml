[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-intake-matrix"
version = "0.1.0"
description = "Matrix intake adapter for agent-media (chat room -> speech/music/book)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]
# Matrix protocol via stdlib urllib — no extra deps.

[project.scripts]
media-intake-matrix = "agent_media_intake_matrix:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_intake_matrix"]
