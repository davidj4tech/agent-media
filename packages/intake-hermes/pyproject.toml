[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-intake-hermes"
version = "0.1.0"
description = "Hermes Agent shell-hook intake for agent-media: speaks Hermes turn output."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]

[project.scripts]
media-hook-hermes = "agent_media_intake_hermes:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_intake_hermes"]
