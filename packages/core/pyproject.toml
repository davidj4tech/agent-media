[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-core"
version = "0.0.0"
description = "Core lib for agent-media: intake/route/render/transcribe/capture/sinks/state"
requires-python = ">=3.11"
dependencies = [
    # 2.x is required: mcp_server.py uses MCPServer, which replaced the FastMCP
    # class that mcp 2.0.0 deleted along with the whole mcp.server.fastmcp module.
    "mcp>=2",
    "markdown-it-py>=3.0",  # code-block suppression for TTS (intake/_text.py)
    "edge-tts>=6",          # default render engine — render/ shells out to `edge-tts`;
                            # without it a fresh install renders nothing ("no TTS").
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
media                  = "agent_media_core.cli:main"
media-hook-claude-code = "agent_media_core.intake.hook_claude_code:main"
media-hook-pi          = "agent_media_core.intake.hook_pi:main"
media-hook-pi-stream   = "agent_media_core.intake.hook_pi_stream:main"
media-setup            = "agent_media_core.setup:main"
media-mcp              = "agent_media_core.mcp_server:main"
media-mcp-http         = "agent_media_core.mcp_server:main_http"
media-mcp-narrow       = "agent_media_core.mcp_server:main_narrow"
media-book-observer    = "agent_media_core.book_observer:main"
media-call-guard       = "agent_media_core.call_guard:main"
media-speech-state     = "agent_media_core.entrypoints.speech_state:main"
# Optional intake adapters moved to their own packages (still installable,
# same console-script names): agent-media-intake-matrix / -ha / -codex.

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_core"]

# Ship the data directories INSIDE the package.
#
# They sit beside it in the repo (packages/core/services, .../tmux), which an
# editable install resolves fine because `__file__` is still in the checkout.
# A wheel is not a checkout: without this the built wheel carried zero
# `services/` entries, so `media-setup install-services` found no templates at
# all and the single most important setup command silently installed nothing —
# on every non-editable install, which is every install by anyone else.
[tool.hatch.build.targets.wheel.force-include]
"services" = "agent_media_core/services"
"tmux"     = "agent_media_core/tmux"
