[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-completions-shim"
version = "0.1.0"
description = "OpenAI /v1/chat/completions over a live Claude Code session — conversational OWUI Call mode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]
# Stdlib HTTP server; talks to the canvas HTTP surface (/input, /agents, /peek).

[project.scripts]
media-completions-shim = "agent_media_completions_shim:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_completions_shim"]
