[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-tts-shim"
version = "0.1.0"
description = "OpenAI-compatible /v1/audio/speech shim — voices OWUI/SillyTavern through agent-media engines (+ canvas)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]
# Stdlib HTTP server (like the canvas). Renders via agent_media_core.render.

[project.scripts]
media-tts-shim = "agent_media_tts_shim:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_tts_shim"]
