name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install pytest

      - name: Run tests
        working-directory: packages/core
        run: pytest -q

  server:
    # The app's API, split out of the canvas. `visual` is installed too: the
    # contract and CORS tests drive the canvas's handler, because that is what
    # clients reach on 8781. That visual never becomes a dependency of server
    # is its own test (test_app.py imports the server in a clean process).
    name: pytest (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + server + visual + org-paragtd + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/server -e packages/visual -e packages/org-paragtd
          pip install pytest

      - name: Run tests
        run: pytest -q packages/server/tests

  abs-bridge:
    # The Audiobookshelf bridges spent months as untracked files on one host,
    # with no tests and no CI. Running them here is half of what moving them
    # into the repo was for.
    name: pytest (abs-bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + abs-bridge + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/abs-bridge
          pip install pytest

      - name: Run tests
        run: pytest -q packages/abs-bridge/tests
