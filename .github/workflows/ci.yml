name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core (+ server and visual, which some of its tests read) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/server -e packages/visual
          pip install pytest

      - name: Run tests
        working-directory: packages/core
        run: pytest -q

  server:
    # The app's API, split out of the canvas. `visual` is installed too: the
    # contract and CORS tests drive the canvas's handler, because that is what
    # clients reach on 8781. That visual never becomes a dependency of server
    # is its own test (test_app.py imports the server in a clean process).
    name: pytest (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + server + visual + org-paragtd + sasonica + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/server -e packages/visual -e packages/org-paragtd -e packages/sasonica
          pip install pytest

      - name: Run tests
        run: pytest -q packages/server/tests packages/sasonica/tests

  abs-bridge:
    # The Audiobookshelf bridges spent months as untracked files on one host,
    # with no tests and no CI. Running them here is half of what moving them
    # into the repo was for.
    name: pytest (abs-bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + abs-bridge + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/abs-bridge
          pip install pytest

      - name: Run tests
        run: pytest -q packages/abs-bridge/tests

  server-macos:
    # The server on a Mac (docs/proposals/2026-09-29-single-binary.md): the
    # same tests as on Linux, on macOS's own Python.
    name: pytest (server, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + server + visual + org-paragtd + sasonica + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/server -e packages/visual -e packages/org-paragtd -e packages/sasonica
          pip install pytest

      - name: Run tests
        run: pytest -q packages/server/tests packages/sasonica/tests

  server-windows:
    # The server on Windows (docs/proposals/2026-09-29-single-binary.md).
    name: pytest (server, Windows)
    runs-on: windows-latest
    env:
      # UTF-8 mode, as the binary runs on Windows (sasonica/__main__.py):
      # files and pipes are UTF-8, not the console's code page.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + server + visual + org-paragtd + sasonica + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/server -e packages/visual -e packages/org-paragtd -e packages/sasonica
          pip install pytest

      - name: Run tests
        run: pytest -q -p no:cacheprovider packages/server/tests packages/sasonica/tests

  core-windows:
    # Core on Windows, the platform the audio seam's windows backend is for
    # (docs/proposals/2026-09-23-cross-platform.md, "Audio seam"). Installing
    # core here pulls its win32-only dependencies (the winrt-* projections),
    # so the backend's real import is exercised, not a fake.
    name: pytest (core, Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core (+ server and visual, which some of its tests read) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/server -e packages/visual
          pip install pytest
          python -c "import winrt.windows.media.control as m; print('winrt', m.__name__)"

      - name: mpv (the pipe tests drive a real one)
        run: |
          choco install mpv --no-progress -y
          # choco puts mpv on the machine PATH, which later steps do not reread.
          "C:\ProgramData\chocolatey\lib\mpvio.install\tools" >> $env:GITHUB_PATH
          & "C:\ProgramData\chocolatey\lib\mpvio.install\tools\mpv.exe" --version
        continue-on-error: true

      - name: What the audio seam sees here
        run: |
          mpv --no-config --audio-device=help
          media-audio --json
        continue-on-error: true

      # Gating: the audio seam, mpv's control channel, the speech targets they
      # feed, the speech player's launcher and media replay — what has been
      # made to work on Windows.
      - name: Run the audio and mpv-IPC tests
        working-directory: packages/core
        run: >-
          pytest -q -rs -p no:cacheprovider
          tests/test_audio_backend.py tests/test_audio_seam_callers.py
          tests/test_mpv_ipc_pipes.py tests/test_mpv_ipc_snapshot.py
          tests/test_refusal_is_reported.py tests/test_speech_targets.py
          tests/test_audio_targets.py tests/test_sink_speech_launcher.py
          tests/test_procinfo_kill_group.py tests/test_book_pipe.py
          tests/test_replay_follow_playlist.py
          tests/test_replay_holds_the_token.py tests/test_replay_from_sentence.py
          tests/test_replay_card.py tests/test_remote_clip_replay.py tests/test_cli.py
          tests/test_setup.py::test_server_refuses_non_systemd
          tests/test_setup.py::test_server_dry_run_systemd

      # Not gating, yet: the rest of core has never run on Windows, and ~90
      # tests fail there for reasons outside the audio work (AF_UNIX in the
      # converse rendezvous, strftime's %-d, POSIX modes and paths, timing). Run and reported so the count is visible; listed in
      # docs/proposals/2026-09-23-cross-platform.md.
      - name: Run all of core's tests (report only)
        working-directory: packages/core
        continue-on-error: true
        run: pytest -q -rfs -p no:cacheprovider
