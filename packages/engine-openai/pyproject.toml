[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-engine-openai"
version = "0.1.0"
description = "OpenAI TTS render engine for agent-media."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

# No hard dependency on the `openai` package: the engine shells out to a Python
# interpreter that has it (MEDIA_OPENAI_PYTHON, or an auto-discovered pipx venv),
# matching the original core behaviour.

[project.entry-points."agent_media.render_engines"]
openai = "agent_media_engine_openai:render"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_engine_openai"]
