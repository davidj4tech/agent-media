[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-engine-qwen"
version = "0.1.0"
description = "Qwen / DashScope TTS render engine for agent-media."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Uses only the stdlib (urllib) to call the DashScope HTTP API.

[project.entry-points."agent_media.render_engines"]
qwen = "agent_media_engine_qwen:render"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_engine_qwen"]
