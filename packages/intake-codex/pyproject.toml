[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-intake-codex"
version = "0.1.0"
description = "Codex (OpenAI CLI) stdin-pipe intake hook for agent-media."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]

[project.scripts]
media-hook-codex = "agent_media_intake_codex:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_intake_codex"]
