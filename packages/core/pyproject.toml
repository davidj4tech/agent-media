[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-core"
version = "0.0.0"
description = "Core lib for agent-media: intake/route/render/transcribe/capture/sinks/state"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
]

[project.scripts]
media                  = "agent_media_core.cli:main"
media-hook-claude-code = "agent_media_core.intake.hook_claude_code:main"
media-hook-codex       = "agent_media_core.intake.hook_codex:main"
media-hook-pi          = "agent_media_core.intake.hook_pi:main"
media-intake-ha-sse    = "agent_media_core.intake.ha_sse:main"
media-intake-matrix    = "agent_media_core.intake.matrix:main"
media-setup            = "agent_media_core.setup:main"
media-mcp              = "agent_media_core.mcp_server:main"
media-mcp-http         = "agent_media_core.mcp_server:main_http"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_core"]
